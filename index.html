<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickHub Pro - All-In-One Instant Web Utilities</title>
    <!-- License: MIT License - Free to use, modify and monetize -->
    
    <!-- Google AdSense Verification Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7588260712207798"
         crossorigin="anonymous"></script>

    <!-- Google Search Console Verification Tag -->
    <meta name="google-site-verification" content="RsTMjsllRX9DJj5eSgmK0z-TA7u499He6S6Crbg6BgA" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-emerald-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 shadow-lg py-4 px-6 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-400 via-cyan-400 to-indigo-400 bg-clip-text text-transparent flex items-center gap-2">
                <i class="fa-solid fa-bolt text-emerald-400"></i> QuickHub Pro
            </h1>
            <div class="flex items-center gap-3">
                <button onclick="openModal('privacyModal')" class="text-xs text-slate-400 hover:text-white transition-colors">Privacy Policy</button>
                <span class="text-slate-700">|</span>
                <button onclick="openModal('termsModal')" class="text-xs text-slate-400 hover:text-white transition-colors">Terms & License</button>
            </div>
        </div>
    </header>

    <!-- Top AdSense Banner Slot -->
    <div class="max-w-5xl mx-auto w-full px-4 mt-4">
        <div class="bg-slate-900/80 border border-dashed border-slate-800 rounded-xl p-3 text-center text-xs text-slate-500">
            <!-- Google AdSense Ad Unit -->
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-7588260712207798"
                 data-ad-slot="YYYYYYYYYY"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <span class="block mt-1">Advertisement Space (Google AdSense Ready)</span>
        </div>
    </div>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto w-full px-4 py-6 flex-grow">
        
        <!-- Navigation Tabs -->
        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-2 bg-slate-900 p-2 rounded-2xl mb-6 border border-slate-800 shadow-inner">
            <button onclick="switchTab('whatsapp')" id="tab-whatsapp" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-medium transition-all bg-emerald-600 text-white shadow flex items-center justify-center gap-1.5">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </button>
            <button onclick="switchTab('qr')" id="tab-qr" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-qrcode"></i> QR Code
            </button>
            <button onclick="switchTab('text')" id="tab-text" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-font"></i> Styler
            </button>
            <button onclick="switchTab('password')" id="tab-password" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-key"></i> Password
            </button>
            <button onclick="switchTab('counter')" id="tab-counter" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-calculator"></i> Counter
            </button>
            <button onclick="switchTab('base64')" id="tab-base64" class="py-2.5 px-3 rounded-xl text-xs sm:text-sm font-medium transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-code"></i> Encoder
            </button>
        </div>

        <!-- TAB 1: WhatsApp Direct Chat -->
        <div id="content-whatsapp" class="tool-content bg-slate-900 p-6 rounded-3xl border border-slate-800 shadow-2xl space-y-4">
            <!-- Baaki ka content -->
        </div>
    </main>
</body>
</html>
